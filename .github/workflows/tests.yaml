name: Unit Tests

on:
 # push:
 #   branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  test:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        # operating-system: ["ubuntu-latest", "windows-latest", "macos-latest"]
        operating-system: ["macos-latest"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: 3.13

      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-google-vit-base-patch16-224

      - name: Install dependencies
        run: |
          uv sync --locked --dev --extra train --extra serve

      - name: Auth with GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Start BentoML service
        shell: bash
        run: |
          uv run bentoml serve src.dogs_classification.bentoml:DogBreedClassificationService &

      - name: Show BentoML logs
        if: always()
        shell: bash
        run: |
          echo "===== BentoML Log ====="
          cat bentoml.log || true

      - name: Check BentoML process
        shell: bash
        run: |
          ps aux | grep bentoml || true

      - name: Check if service is reachable
        shell: bash
        run: |
          curl -v http://localhost:3000/livez || true

      - name: Run tests
        env:
          BENTOML_URL: http://localhost:3000
        run: |
          uv run coverage run -m pytest tests/ -v --ignore=tests/performancetests
