name: Unit Tests

on:
 # push:
 #   branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  test:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: ["ubuntu-latest", "windows-latest", "macos-latest"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: 3.13

      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-google-vit-base-patch16-224

      - name: Install dependencies
        run: |
          uv sync --locked --dev

      - name: Run tests
        env:
          DISABLE_PREDICTION_LOGGING: "true"
        run: |
          uv run coverage run -m pytest tests/ -v --ignore=tests/performancetests
