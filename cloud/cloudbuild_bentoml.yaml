steps:
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Download ONNX model'
  entrypoint: 'bash'
  args: ['-c', 'mkdir -p models && gsutil cp gs://mlops-dog-data-euwest4/models/dog_classifier.onnx* models/']
- name: 'gcr.io/cloud-builders/docker'
  id: 'Pull previous bentoml image'
  entrypoint: 'bash'
  args: ['-c', 'docker pull europe-west4-docker.pkg.dev/mlopsdogclassification/mlops-dog-classification/dogs-bentoml:latest || exit 0']
- name: 'gcr.io/cloud-builders/docker'
  id: 'Build bentoml image'
  env:
    - 'DOCKER_BUILDKIT=1'
  args: [
    'build',
    '.',
    '-t',
    'europe-west4-docker.pkg.dev/mlopsdogclassification/mlops-dog-classification/dogs-bentoml:latest',
    '--cache-from',
    'europe-west4-docker.pkg.dev/mlopsdogclassification/mlops-dog-classification/dogs-bentoml:latest',
    '--build-arg',
    'BUILDKIT_INLINE_CACHE=1',
    '-f',
    'dockerfiles/bentoml.dockerfile'
  ]
- name: 'gcr.io/cloud-builders/docker'
  id: 'Push bentoml image'
  args: [
    'push',
    'europe-west4-docker.pkg.dev/mlopsdogclassification/mlops-dog-classification/dogs-bentoml:latest'
  ]
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Update monitoring config secret'
  args: [
    'gcloud', 'secrets', 'versions', 'add', 'dogs-bentoml-monitoring-config',
    '--data-file', 'cloud/run-monitoring.yaml',
    '--project', 'mlopsdogclassification'
  ]
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Deploy to Cloud Run'
  args: [
    'gcloud', 'run', 'services', 'replace', 'cloud/run-service.yaml',
    '--region', 'europe-west4',
    '--project', 'mlopsdogclassification'
  ]
options:
  logging: CLOUD_LOGGING_ONLY
