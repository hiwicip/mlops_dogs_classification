method: random
program: src/dogs_classification/train.py
name: MLOPs Sweep
project: dogs-classification
entity: awinterstetter
metric:
  goal: minimize
  name: val_loss
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
parameters:
  training.lr:
    distribution: log_uniform_values
    min: 0.0000001
    max: 0.00001
  training.batch_size:
    values: [16, 32, 64]
  training.epochs:
    values: [10, 15, 20]
run_cap: 10
