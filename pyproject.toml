[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[project]
name = "dogs_classification"
version = "0.0.1"
description = "Classifier of dog breeds."
authors = [
  { name = "hiwicip", email = "your@email.com" },
]
license = { file = "LICENSE" }
keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dvc>=3.67.1",
    "dvc-gs>=3.0.2",
    "fastapi==0.136.1",
    "gcloud>=0.18.3",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "kagglehub>=1.0.1",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "scikit-learn>=1.8.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.3",
    "transformers>=5.8.1",
    "typer==0.15.1",
    "typing>=3.10.0.0",
    "uvicorn==0.34.0",
    "matplotlib>=3.10.9",
    "wandb>=0.27.0",
]

[dependency-groups]
dev = [
    "coverage==7.14.0",
    "invoke==3.0.3",
    "pre-commit==4.6.0",
    "pytest==8.3.4",
    "ruff==0.1.3",
    "mypy==2.1.0",
    "mkdocs-material==9.7.1",
    "mkdocstrings-python==2.0.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (PEP8)
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear (common bugs)
    "UP",  # pyupgrade (modern Python syntax)
]

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "wandb"
follow_imports = "skip"
