[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[project]
name = "dogs_classification"
version = "0.0.1"
description = "Classifier of dog breeds."
authors = [
  { name = "hiwicip", email = "your@email.com" },
]
license = { file = "LICENSE" }
keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dvc>=3.67.1",
    "dvc-gs>=3.0.2",
    "fastapi==0.136.1",
    "gcloud>=0.18.3",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "kagglehub>=1.0.1",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "scikit-learn>=1.8.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.68.2",
    "transformers>=5.10.1",
    "typer==0.15.1",
    "typing>=3.10.0.0",
    "uvicorn==0.34.0",
    "torch-tb-profiler>=0.4.3",
    "matplotlib>=3.10.9",
    "wandb>=0.27.0",
    "pytorch-lightning>=2.6.5",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "locust>=2.44.3",
]

[dependency-groups]
dev = [
    "coverage==7.14.1",
    "invoke==3.0.3",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "ruff==0.1.3",
    "mypy==2.1.0",
    "mkdocs-material==9.7.6",
    "mkdocstrings-python==2.0.4",
    "httpx>=0.28.1",
    "pluggy>=1.6.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
ignore = ["B008"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (PEP8)
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear (common bugs)
    "UP",  # pyupgrade (modern Python syntax)
]

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*LeafSpec.*",
    "ignore:.*num_workers.*:UserWarning",
    "ignore:.*eval mode.*:UserWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.mypy]
ignore_missing_imports = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "wandb"
follow_imports = "skip"
