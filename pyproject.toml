[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[project]
name = "dogs_classification"
version = "0.0.1"
description = "Classifier of dog breeds."
authors = [
  { name = "hiwicip", email = "your@email.com" },
]
license = { file = "LICENSE" }
keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0.0",
    "pillow>=12.3.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=5.10.1",
    "onnxruntime>=1.27.0",
    "typer==0.26.7",
]

[project.optional-dependencies]
train = [
    "pytorch-lightning>=2.6.5",
    "wandb>=0.27.0",
    "hydra-core>=1.3.4",
    "omegaconf>=2.3.1",
    "kagglehub>=1.0.1",
    "pandas>=3.0.3",
    "scikit-learn>=1.8.0",
    "tqdm>=4.68.2",
    "matplotlib>=3.11.0",
    "google-cloud-storage>=2.0.0",
    "onnx>=1.22.0",
    "onnxscript>=0.7.0",
]
serve = [
    "fastapi==0.139.0",
    "uvicorn==0.49.0",
    "bentoml>=1.4.39",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "prometheus-client>=0.25.0",
    "google-cloud-storage>=2.0.0",
]
frontend = [
    "streamlit>=1.59.0",
    "google-cloud-run>=0.16.1",
    "pandas>=3.0.3",
    "requests>=2.32.0",
]
cloud = [
    "dvc>=3.67.1",
    "dvc-gs>=3.0.2",
    "google-cloud-storage>=2.0.0",
    "evidently>=0.7.21",
]

[dependency-groups]
dev = [
    "coverage==7.15.1",
    "invoke==3.0.3",
    "pre-commit==4.6.0",
    "pytest==9.1.1",
    "ruff==0.15.20",
    "mypy==2.3.0",
    "mkdocs-material==9.7.6",
    "mkdocstrings-python==2.0.5",
    "httpx>=0.28.1",
    "pluggy>=1.6.0",
    "matplotlib>=3.11.0",
    "torch-tb-profiler>=0.4.3",
    "locust>=2.45.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (PEP8)
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear (common bugs)
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*LeafSpec.*",
    "ignore:.*num_workers.*:UserWarning",
    "ignore:.*eval mode.*:UserWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.mypy]
ignore_missing_imports = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "wandb"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "google.cloud"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "google.cloud.*"
follow_imports = "skip"
